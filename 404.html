<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volt</title>
<body style="font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px">
<div id="o"><p>Nothing here.</p></div>
<script>
var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
if(location.pathname.indexOf('/callback')===0){var o=document.getElementById('o');
if(c){o.innerHTML='<h2>Tesla sign-in done</h2><p>Copy this code and paste it into Volt\'s secure box:</p><textarea id="t" readonly style="width:100%;height:90px;font-size:14px"></textarea><p><button id="b" style="font-size:18px;padding:8px 16px">Copy code</button></p>';
var t=document.getElementById('t');t.value=c;document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c);this.textContent='Copied';};}
else if(e){o.innerHTML='<h2>Sign-in error</h2><p></p>';o.querySelector('p').textContent=e+' '+(p.get('error_description')||'');}}
</script>
